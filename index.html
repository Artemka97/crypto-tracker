HTML_PAGE = """
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #121212; color: white; margin: 0; padding: 15px; text-align: center; }
        .header { font-size: 22px; font-weight: bold; color: #0098EA; margin-bottom: 20px; }
        
        .coin-list { display: flex; gap: 10px; margin-bottom: 20px; }
        .coin-btn { flex: 1; background: #1e1e1e; padding: 15px 5px; border-radius: 15px; border: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .coin-btn.active { border-color: #0098EA; background: #252a30; }
        .coin-symbol { font-size: 14px; color: #aaa; }
        .coin-price { font-size: 16px; font-weight: bold; margin-top: 5px; }

        .details-card { background: #1e1e1e; padding: 20px; border-radius: 20px; border: 1px solid #333; display: none; }
        .details-card.active { display: block; animation: fadeIn 0.3s; }
        .big-price { font-size: 36px; font-weight: bold; margin: 10px 0; }
        .rub-price { font-size: 18px; color: #aaa; margin-bottom: 20px; }
        
        .chart-container { height: 250px; width: 100%; margin-bottom: 15px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="header">💎 Crypto Tracker</div>

    <div class="coin-list">
        <div class="coin-btn active" onclick="selectCoin('ton')" id="btn-ton">
            <div class="coin-symbol">GRAM</div>
            <div class="coin-price" id="list-ton">...</div>
        </div>
        <div class="coin-btn" onclick="selectCoin('usdt')" id="btn-usdt">
            <div class="coin-symbol">USDT</div>
            <div class="coin-price" id="list-usdt">...</div>
        </div>
        <div class="coin-btn" onclick="selectCoin('btc')" id="btn-btc">
            <div class="coin-symbol">BTC</div>
            <div class="coin-price" id="list-btc">...</div>
        </div>
    </div>

    <div class="details-card active" id="details-ton">
        <div style="color:#aaa;">Текущий курс Gram</div>
        <div class="big-price" id="price-ton-usd">...</div>
        <div class="rub-price" id="price-ton-rub">≈ ... ₽</div>
        <div class="chart-container"><canvas id="chart-ton"></canvas></div>
    </div>
    
    <div class="details-card" id="details-usdt">
        <div style="color:#aaa;">Текущий курс USDT</div>
        <div class="big-price" id="price-usdt-usd">...</div>
        <div class="rub-price" id="price-usdt-rub">≈ ... ₽</div>
        <div class="chart-container"><canvas id="chart-usdt"></canvas></div>
    </div>

    <div class="details-card" id="details-btc">
        <div style="color:#aaa;">Текущий курс Bitcoin</div>
        <div class="big-price" id="price-btc-usd">...</div>
        <div class="rub-price" id="price-btc-rub">≈ ... ₽</div>
        <div class="chart-container"><canvas id="chart-btc"></canvas></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let prices = { ton: 0, usdt: 1, btc: 0 };
        let rubRate = 80.5; 
        let charts = {};

        function selectCoin(coin) {
            document.querySelectorAll('.coin-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.details-card').forEach(c => c.classList.remove('active'));
            document.getElementById('btn-' + coin).classList.add('active');
            document.getElementById('details-' + coin).classList.add('active');
        }

        function loadData() {
            fetch('/api/prices')
            .then(res=> res.json())
            .then(data => {
                prices = data.prices;
                rubRate = data.rub_rate;
                
                document.getElementById('list-ton').innerText = '$' + prices.ton.toFixed(3);
                document.getElementById('list-usdt').innerText = '$' + prices.usdt.toFixed(2);
                document.getElementById('list-btc').innerText = '$' + Math.round(prices.btc).toLocaleString('ru-RU');

                updateCoinDetails('ton', prices.ton);
                updateCoinDetails('usdt', prices.usdt);
                updateCoinDetails('btc', prices.btc);
            });
        }

        function updateCoinDetails(coin, usdPrice) {
            let usdDisplay = (coin === 'btc') ? Math.round(usdPrice).toLocaleString('ru-RU') : usdPrice.toFixed(3);
            document.getElementById('price-' + coin + '-usd').innerText = '$' + usdDisplay;
            
            let rubPrice = usdPrice * rubRate;
            let rubDisplay = (coin === 'btc') ? Math.round(rubPrice).toLocaleString('ru-RU') : rubPrice.toFixed(2);
            document.getElementById('price-' + coin + '-rub').innerText = '≈ ' + rubDisplay + ' ₽';
            
            let history = [];
            for (let i = 0; i < 20; i++) {
                let noise = (Math.random() - 0.5) * (usdPrice * 0.04); 
                history.push(usdPrice + noise);
            }
            drawChart('chart-' + coin, history, coin);
        }

        function drawChart(id, data, color) {
            if (charts[id]) charts[id].destroy();
            const ctx = document.getElementById(id).getContext('2d');
            
            let chartColor = '#0098EA';
            if (color === 'btc') chartColor = '#f39c12';
            if (color === 'usdt') chartColor = '#2ecc71';

            charts[id] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map((_, i) => i),
                    datasets: [{
                        data: data,
                        borderColor: chartColor,
                        backgroundColor: chartColor + '33',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
            });
        }

        loadData();
        setInterval(loadData, 30000); // Автообновление каждые 30 секунд
    </script>
</body>
</html>
"""
